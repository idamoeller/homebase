<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tell Mom</title>
<meta name="theme-color" content="#FAF9F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tell Mom">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root{--bg:#FAF9F6;--surface:#FFFFFF;--ink:#1C1B19;--muted:#6D6A63;--line:#E6E3DC;--field:#DAD6CD;--accent:#2C6B45;--accent-ink:#FFFFFF;--accent-soft:#E4ECE6;--accent-text:#1E4A30;--danger:#9C3B34}
  @media (prefers-color-scheme: dark){
    :root{--bg:#161614;--surface:#201F1C;--ink:#ECEAE4;--muted:#9B978E;--line:#33312C;--field:#3A3833;--accent:#7DB592;--accent-ink:#0F1A13;--accent-soft:#22332A;--accent-text:#A9D3B8;--danger:#E08A80}
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button,textarea{font:inherit;color:inherit}
  main{max-width:520px;margin:0 auto;padding:36px 16px calc(32px + env(safe-area-inset-bottom))}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  h1{font-weight:500;font-size:34px;letter-spacing:-.025em;margin:6px 0 6px}
  .sub{color:var(--muted)}
  .who{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 16px}
  .who button{border:1px solid var(--field);background:var(--surface);border-radius:2px;padding:10px 16px;min-height:44px;font-weight:500;cursor:pointer}
  .who button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
  textarea{width:100%;min-height:130px;padding:14px;border:1px solid var(--field);border-radius:2px;background:var(--surface);resize:vertical}
  textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .btn{width:100%;margin-top:12px;border:1px solid var(--accent);border-radius:2px;padding:15px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:17px;cursor:pointer}
  .btn:disabled{opacity:.5}
  .ok{padding:48px 0}
  .err{color:var(--danger);margin-top:12px}
  .link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;margin-top:16px}
  /* Press feedback: every button visibly "pushes" when tapped or clicked. */
  button{transition:transform .08s ease,filter .08s ease;-webkit-tap-highlight-color:transparent}
  button:active:not(:disabled){transform:scale(.96);filter:brightness(.92)}
  .swatches button:active{transform:scale(.88)}
</style>
</head>
<body>
<main id="app"><p class="sub">Loading…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var sb = window.supabase.createClient('https://dufbnditthfnnchnvauu.supabase.co','sb_publishable_77y6hL-fIGu-iEa2DVs-ow_W-OtGtIF',
    {auth:{persistSession:false}});
  var token=new URLSearchParams(location.search).get('k')||'';
  var S={names:[],from:'',text:'',sent:false,err:'',busy:false};
  try{ S.from=localStorage.getItem('homebase-from')||''; }catch(e){}
  var app=document.getElementById('app');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function draw(){
    if(S.sent){
      app.innerHTML='<div class="ok"><div class="eyebrow">Sent</div><h1>Got it</h1><p class="sub">Mom will see it in Homebase.</p>'+
        '<button class="link" data-act="again">Send another</button></div>';
      return;
    }
    var ta=app.querySelector('textarea'); if(ta) S.text=ta.value;
    app.innerHTML='<div class="eyebrow">Homebase</div><h1>Tell Mom</h1><p class="sub">Need something? Sign-ups, rides, stuff to buy, things to remember.</p>'+
      '<div class="who">'+S.names.map(function(n){
        return '<button data-act="who" data-v="'+esc(n)+'" class="'+(S.from===n?'on':'')+'">'+esc(n)+'</button>'; }).join('')+'</div>'+
      '<textarea placeholder="Sign me up for spring soccer before Friday">'+esc(S.text)+'</textarea>'+
      '<button class="btn" data-act="send"'+(S.busy?' disabled':'')+'>Send to Mom</button>'+
      (S.err?'<div class="err">'+esc(S.err)+'</div>':'');
  }

  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-act]'); if(!el) return;
    var act=el.getAttribute('data-act');
    if(act==='who'){ S.from=el.getAttribute('data-v'); try{ localStorage.setItem('homebase-from',S.from); }catch(_){} S.err=''; draw(); }
    else if(act==='again'){ S.sent=false; S.text=''; draw(); }
    else if(act==='send'){
      var text=app.querySelector('textarea').value.trim();
      if(S.names.length && !S.from){ S.err='Tap your name first.'; draw(); return; }
      if(!text){ S.err='Type what you need.'; draw(); return; }
      S.busy=true; S.err=''; draw();
      sb.rpc('submit_request',{p_token:token,p_from:S.from,p_text:text}).then(function(r){
        S.busy=false;
        if(r.error){ S.err=r.error.message; draw(); return; }
        S.sent=true; S.text=''; draw();
      });
    }
  });

  if(!token){ app.innerHTML='<h1>Tell Mom</h1><p class="sub">This link is missing its code. Ask Mom for the link again.</p>'; return; }
  sb.rpc('request_page',{p_token:token}).then(function(r){
    if(r.error || !r.data || !r.data.length){
      app.innerHTML='<h1>Tell Mom</h1><p class="sub">This link doesn\'t work anymore. Ask Mom for the new one.</p>'; return;
    }
    S.names=(r.data[0].names||[]).filter(function(n){ return n; });
    if(S.names.indexOf(S.from)<0) S.from='';
    draw();
  });
})();
</script>
</body>
</html>
